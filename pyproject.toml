[tool.poetry]
name = "todolist"
version = "0.2.0"
description = "ToDoList Phase 2 - PostgreSQL + SQLAlchemy"
authors = ["Sania <saniaezzati1384@gmail.com>"]
packages = [{ include = "todolist" }]

[tool.poetry.dependencies]
python = "^3.10"
python-dotenv = "^1.0.0"
SQLAlchemy = "^2.0"
alembic = "^1.11"
psycopg2-binary = "^2.9"
schedule = "^1.2.0"

[tool.poetry.dev-dependencies]
pytest = "^7.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
